name: macos
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Stock macOS: bash 3.2, no GNU coreutils/flock. Homebrew bash first on PATH; timeout/flock stay absent on purpose
      # so the built-in fallbacks are what runs (jq and git come from the runner image).
      # gnu-sed only for the test scripts' `sed -i` (BSD sed -i is out of scope); production helpers never use it.
      - run: brew install bash jq gnu-sed
      - run: |
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      # Test scripts call sha256sum; macOS has shasum only. Test-only shim, production helpers never use either.
      - run: |
          mkdir -p "$RUNNER_TEMP/shim"
          printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/shim/sha256sum"
          chmod +x "$RUNNER_TEMP/shim/sha256sum"
          echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
      - run: ./scripts/validate.sh
